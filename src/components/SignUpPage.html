<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Sign Up Page</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-rose-200 via-pink-100 to-orange-100 p-6 overflow-hidden">

  <!-- Background Blur Effects -->
  <div class="absolute top-0 left-0 w-72 h-72 bg-pink-300 opacity-30 rounded-full blur-3xl"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-orange-200 opacity-40 rounded-full blur-3xl"></div>

  <!-- Main Card -->
  <div class="relative z-10 w-full max-w-6xl bg-[#f7f7f9] rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-2">

    <!-- ================= LEFT SIDE - FORM ================= -->
    <div class="flex flex-col justify-center px-8 py-12 md:px-16">

      <!-- Title -->
      <h1 class="text-4xl font-bold text-gray-800 mb-3">
        Create account
      </h1>

      <!-- Subtitle -->
      <p class="text-sm text-gray-500 mb-8">
        Let's get started!
      </p>

      <!-- Form -->
      <form class="space-y-5">

        <!-- Name Input -->
        <div>
          <input
            type="text"
            placeholder="Name"
            class="w-full px-4 py-3 rounded-xl bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-rose-300 transition duration-300"
          />
        </div>

        <!-- Email Input -->
        <div>
          <input
            type="email"
            placeholder="Email"
            class="w-full px-4 py-3 rounded-xl bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-rose-300 transition duration-300"
          />
        </div>

        <!-- Password Input -->
        <div class="relative">
          <input
            type="password"
            placeholder="Password"
            class="w-full px-4 py-3 rounded-xl bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-rose-300 transition duration-300"
          />

          <!-- Eye Icon -->
          <button
            type="button"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"
          >
            👁
          </button>
        </div>

        <!-- Create Account Button -->
        <button
          type="submit"
          class="w-full bg-rose-400 hover:bg-rose-500 text-white py-3 rounded-xl font-medium shadow-md hover:shadow-lg transition duration-300"
        >
          Create account
        </button>
      </form>

            <!-- Login Text -->
      <p class="text-sm text-gray-500 mt-6">
        Already have an account?
        <a href="LoginPage.html" class="text-rose-500 font-medium hover:underline">
          Login
        </a>
      </p>

    </div>

    <!-- ================= RIGHT SIDE - IMAGE ================= -->
    <div class="hidden lg:block relative">

      <!-- Image -->
      <img
        src="../assets/mambo.jpg"
        alt="Landscape"
        class="w-full h-full object-cover"
      />

      <!-- Gradient Overlay -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
    </div>

  </div>

</body>
</html>
