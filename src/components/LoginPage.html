<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Login Page</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-rose-200 via-pink-100 to-orange-100 overflow-hidden p-6 relative">

  <!-- Background Blur Decorations -->
  <div class="absolute top-0 left-0 w-72 h-72 bg-pink-300 opacity-30 rounded-full blur-3xl"></div>

  <div class="absolute bottom-0 right-0 w-96 h-96 bg-orange-300 opacity-30 rounded-full blur-3xl"></div>

  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-rose-200 opacity-20 rounded-full blur-3xl"></div>

  <!-- Main Container -->
  <div class="relative z-10 w-full max-w-6xl bg-white/60 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-2">

    <!-- ================= LEFT SIDE ================= -->
    <div class="flex flex-col justify-center px-8 py-12 md:px-16">

      <!-- Title -->
      <h1 class="text-4xl font-bold text-gray-800 mb-3">
        Welcome Back
      </h1>

      <!-- Subtitle -->
      <p class="text-gray-500 text-sm mb-8">
        Login to continue your beautiful journey.
      </p>

      <!-- Form -->
      <form class="space-y-5">

        <!-- Email Input -->
        <div>
          <input
            type="email"
            placeholder="Email Address"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-rose-300 transition duration-300"
          />
        </div>

        <!-- Password Input -->
        <div class="relative">
          <input
            type="password"
            placeholder="Password"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-rose-300 transition duration-300"
          />

          <!-- Eye Icon -->
          <button
            type="button"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"
          >
            👁
          </button>
        </div>

        <!-- Forgot Password -->
        <div class="flex justify-end">
          <a
            href="#"
            class="text-sm text-rose-500 hover:underline"
          >
            Forgot password?
          </a>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          class="w-full bg-rose-400 hover:bg-rose-500 text-white py-3 rounded-xl font-medium shadow-md hover:shadow-lg transition duration-300"
        >
          Login
        </button>

      </form>

      <!-- Bottom Text -->
      <p class="text-sm text-gray-500 mt-6 text-center">
        Don’t have an account?
        <a
          href="SignUpPage.html"
          class="text-rose-500 font-medium hover:underline"
        >
          Register
        </a>
      </p>

    </div>

    <!-- ================= RIGHT SIDE ================= -->
    <div class="hidden lg:block relative">

      <!-- Landscape Image -->
      <img
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600&auto=format&fit=crop"
        alt="Landscape"
        class="w-full h-full object-cover"
      />

      <!-- Gradient Overlay -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/30 via-black/10 to-transparent"></div>

      <!-- Text Overlay -->
      <div class="absolute bottom-10 left-10 text-white max-w-sm">
        <h2 class="text-3xl font-semibold mb-3">
          Elegant & Modern Experience
        </h2>

        <p class="text-sm text-white/80 leading-relaxed">
          A beautifully crafted authentication page with a soft modern aesthetic inspired by premium SaaS platforms.
        </p>
      </div>

    </div>

  </div>

</body>
</html>
